services:
  shopco-backend:
    # Deployments set SHOPCO_IMAGE / SHOPCO_TAG (see .github/workflows/backend-deploy.yml).
    # This file is production-only: it never builds. For local builds,
    # docker-compose.override.yml (loaded automatically) adds the build section.
    image: ${SHOPCO_IMAGE:-ghcr.io/jhuang239/shopco-backend}:${SHOPCO_TAG:-latest}
    container_name: shopco-backend
    restart: unless-stopped
    networks:
      - proxy
    env_file:
      - .env # Runtime secrets (prismadb_connector, OCI keys, JWT, ...) stay on the host
    labels:
      - traefik.enable=true
      - traefik.http.routers.shopco-backend.rule=Host(`shopco-backend.${DOMAIN}`)
      - traefik.http.services.shopco-backend.loadbalancer.server.port=${PORT}
      - traefik.http.routers.shopco-backend.tls=true
      - traefik.http.routers.shopco-backend.entrypoints=websecure
      - traefik.http.routers.shopco-backend.tls.certresolver=cloudflare

networks:
  proxy:
    external: true
